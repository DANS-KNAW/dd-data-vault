openapi: 3.0.1

servers:
  - url: http://localhost:20365/

info:
  description: Service for managing a Data Vault
  version: 2.3.0
  title: dd-data-vault-api
  contact:
    email: info@dans.knaw.nl
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

paths:
  /:
    get:
      operationId: rootGet
      summary: Returns a description of the service.
      responses:
        '200':
          description: description of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfo'

  /imports:
    get:
      operationId: importsGet
      summary: Returns import jobs and their status
      description: Results are ordered by creation time and job ID. Filters are combined before paging.
      parameters:
        - name: status
          in: query
          description: Repeat to select multiple statuses; omit to select all statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [PENDING, RUNNING, SUCCESS, FAILED]
        - name: limit
          in: query
          description: Maximum number of jobs to return; must be positive.
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          description: Number of jobs to skip; requires limit and defaults to zero.
          schema:
            type: integer
            minimum: 0
        - name: batch
          in: query
          description: Exact batch path, relative to the configured inbox or absolute within it.
          schema:
            type: string
      responses:
        '200':
          description: A list of all current import jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportJobStatus'
        '400':
          description: Invalid status, pagination, or batch path outside the configured inbox.
    post:
      operationId: importsPost
      summary: Submits a new import job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommand'
      responses:
        '201':
          description: The job has been submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobStatus'

  /imports/{id}:
    get:
      operationId: importsIdGet
      summary: Returns the import job with the specified id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the job
      responses:
        '200':
          description: The job with the specified id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobStatus'
        '404':
          description: No job with the specified id was found

  /imports/cleanup:
    post:
      operationId: importsCleanupPost
      summary: Cleans up the inbox and outbox of all successfully finished import jobs
      responses:
        '200':
          description: Cleanup completed successfully

  /imports/restage-failed:
    post:
      operationId: importsRestageFailedPost
      summary: Restage failed imports in the inbox
      description: |
        Restores failed object directories without starting a new job or modifying job records.
        A canonical UUID identifies an import job, including a single-object job; otherwise the
        selector is a batch path relative to or contained in the inbox. Prefix a UUID-shaped
        batch name with ./ to select it as a path. Missing or empty failed directories are no-ops.
        A filesystem failure or concurrent filesystem changes may leave a partially restaged batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestageFailedRequest'
      responses:
        '200':
          description: Restaging completed successfully
        '400':
          description: Invalid selector or path
        '404':
          description: Import job not found
        '409':
          description: An active import job or destination conflict prevents restaging
        '500':
          description: Filesystem failure; some objects may already have been restaged

  /layers:
    post:
      operationId: layersPost
      summary: Creates a new top layer, closing and archiving the current top layer
      responses:
        '201':
          description: The new top layer has been created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerStatus'

  /layers/{layerId}:
    get:
      operationId: layersIdGet
      summary: Returns the status of the layer with the specified id
      parameters:
        - name: layerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The timestamp of the layer, in milliseconds since the epoch
      responses:
        '200':
          description: The status of the layer with the specified id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerStatus'
        '404':
          description: No layer with the specified id was found

  /layers/{layerId}/close:
    post:
      operationId: layersIdClosePost
      summary: Closes the layer with the specified id. This is a synchronous operation.
      parameters:
        - name: layerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The timestamp of the layer, in milliseconds since the epoch
      responses:
        '200':
          description: The layer has been closed.
        '400':
          description: The layer with the specified id cannot be archived, because its current state is not OPEN.
        '404':
          description: No layer with the specified id was found

  /layers/{layerId}/archive:
    post:
      operationId: layersIdArchivePost
      summary: Requests the archiving of the layer with the specified id. The operation may be performed asynchronously,
        so the caller should check the layer's status to determine when the archiving is complete.
      parameters:
        - name: layerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The timestamp of the layer, in milliseconds since the epoch
      responses:
        '202':
          description: The request to archive the layer has been accepted
        '400':
          description: The layer with the specified id cannot be archived, because its current state is not CLOSED or there is already an archive file.
            To overwrite an archive file with the contents of a reopened layer use the /rearchive endpoint.
        '404':
          description: No layer with the specified id was found

  /layers/{layerId}/rearchive:
    post:
      operationId: layersIdRearchivePost
      summary: Requests the rearchiving of the layer with the specified id. The operation may be performed asynchronously,
        so the caller should check the layer's status to determine when the archiving is complete.
      parameters:
        - name: layerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The timestamp of the layer, in milliseconds since the epoch
      responses:
        '202':
          description: The request to archive the layer has been accepted
        '404':
          description: No layer with the specified id was found

  /layers/{layerId}/reopen:
    post:
      operationId: layersIdReopenPost
      summary: Requests the reopening of the layer with the specified id. The operation may be performed asynchronously, so the caller should check the layer's status to determine when the reopening is complete.
      parameters:
        - name: layerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The timestamp of the layer, in milliseconds since the epoch
      responses:
        '202':
          description: The request to reopen the layer has been accepted
        '400':
          description: The layer with the specified id cannot be reopened, because its current state is not ARCHIVED or CLOSED
        '404':
          description: No layer with the specified id was found
        '409':
          description: The layer is not in the CLOSED state

  /itemstore/create-directory:
    post:
      operationId: itemstoreCreateDirectoryPost
      summary: Creates a new directory in the item store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectoryRequest'
      responses:
        '200':
          description: The directory has been created
        '400':
          description: Bad request
        '404':
          description: The item store was not found
        '409':
          description: The item store is not in the OPEN state

  /itemstore/delete-directory:
    post:
      operationId: itemstoreDeleteDirectoryPost
      summary: Deletes a directory from the item store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDirectoryRequest'
      responses:
        '200':
          description: The directory has been deleted
        '400':
          description: Bad request
        '404':
          description: The item store was not found
        '409':
          description: The item store is not in the OPEN state

  /itemstore/delete-files:
    post:
      operationId: itemstoreDeleteFilesPost
      summary: Deletes files from the item store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFilesRequest'
      responses:
        '200':
          description: The files have been deleted
        '400':
          description: Bad request
        '404':
          description: The item store was not found
        '409':
          description: The item store is not in the OPEN state

  /itemstore/copy-directory-into:
    post:
      operationId: itemstoreCopyDirectoryIntoPost
      summary: Copies a directory into the item store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDirectoryIntoRequest'
      responses:
        '200':
          description: The directory has been copied
        '400':
          description: Bad request
        '404':
          description: The item store was not found
        '409':
          description: The item store is not in the OPEN state

  /itemstore/copy-file-into:
    post:
      operationId: itemstoreCopyFileIntoPost
      summary: Copies a file into the item store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyFileIntoRequest'
      responses:
        '200':
          description: The file has been copied
        '400':
          description: Bad request
        '404':
          description: The item store was not found
        '409':
          description: The item store is not in the OPEN state

  /itemstore/copy-file-out-of:
    post:
      operationId: itemstoreCopyFileOutOfPost
      summary: Copies a file out of the item store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyFileOutOfRequest'
      responses:
        '200':
          description: The file has been copied
        '400':
          description: Bad request
        '404':
          description: The item store was not found
        '409':
          description: The item store is not in the OPEN state

  /layers/top:
    get:
      operationId: layersTopGet
      summary: Returns the status of the top layer
      responses:
        '200':
          description: The status of the top layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerStatus'

  /layers/ids:
    get:
      operationId: layersIdsGet
      summary: Returns a list of all layer ids
      responses:
        '200':
          description: A list of all layer ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64

  /objects/{id}/versions/{nr}:
    get:
      operationId: objectsIdVersionsNrGet
      summary: Returns the properties of the given object version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nr
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Information object the requested version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcflObjectVersion'

  /ocfl/objects:
    get:
      operationId: ocflObjectsGet
      summary: List OCFL object IDs
      description: >-
        Lists all objects by default. The blocked and ingested filters are independent;
        when both are supplied, only objects matching both are returned.
      tags:
        - ocfl
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: blocked
          in: query
          description: Filter by blocked status; omitted returns both blocked and unblocked objects.
          schema:
            type: boolean
        - name: ingested
          in: query
          description: Filter by ingestion status; omitted returns both ingested and uningested objects.
          schema:
            type: boolean
      responses:
        '200':
          description: List of object IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /ocfl/objects/{id}/blocked:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: ocflObjectsIdBlockedGet
      summary: Get the blocked status of an object
      tags:
        - ocfl
      responses:
        '200':
          description: Whether the object is blocked
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Object not found
    delete:
      operationId: ocflObjectsIdBlockedDelete
      summary: Clear the blocked status of an object
      description: Idempotently clears the blocked status; an already unblocked object also succeeds.
      tags:
        - ocfl
      responses:
        '204':
          description: Object is unblocked; no response body
        '404':
          description: Object not found

  /ocfl/objects/{id}/details:
    get:
      operationId: ocflObjectsIdDetailsGet
      summary: Get detailed overview of an OCFL object
      tags:
        - ocfl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object details including version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcflObjectDetails'
        '404':
          description: Object not found

  /ocfl/objects/{id}/extension-files:
    get:
      operationId: ocflObjectsIdExtensionFilesGet
      summary: List all extension files for an OCFL object
      tags:
        - ocfl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of extension file details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OcflExtensionFileDetails'
        '404':
          description: Object not found

  /ocfl/objects/{id}/extension-file:
    get:
      operationId: ocflObjectsIdExtensionFileGet
      summary: Get the content of a specific extension file
      tags:
        - ocfl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: The path to the specific extension file (can contain slashes)
          schema:
            type: string
      responses:
        '200':
          description: The content of the file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Object or file not found

  /ocfl/objects/{id}/versions/{nr}/details:
    get:
      operationId: ocflObjectsIdVersionsNrDetailsGet
      summary: Get details of a specific version of an OCFL object
      tags:
        - ocfl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nr
          in: path
          required: true
          schema:
            type: string
          description: Version number or 'latest'
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcflVersionDetails'
        '404':
          description: Object or version not found

  /ocfl/objects/{id}/versions/{nr}/files:
    get:
      operationId: ocflObjectsIdVersionsNrFilesGet
      summary: List files in a specific version of an OCFL object
      tags:
        - ocfl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nr
          in: path
          required: true
          schema:
            type: string
          description: Version number or 'latest'
      responses:
        '200':
          description: List of file details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OcflFileDetails'
        '404':
          description: Object or version not found

  /object-version-properties/{id}/{nr}:
    get:
      operationId: objectVersionPropertiesIdNrGet
      summary: Get all object version properties of a specific version of an OCFL object
      description: >-
        Object version properties are defined by the DANS object-version-properties OCFL extension. The allowed properties and their types are defined in the
        property registry of the storage root.
      tags:
        - objectVersionProperties
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/VersionNumberOrLatest'
      responses:
        '200':
          description: The properties of the version, as a JSON object mapping property names to their values
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { }
        '400':
          description: Invalid version number
        '404':
          description: Object or version not found

  /object-version-properties/{id}/{nr}/{name}:
    get:
      operationId: objectVersionPropertiesIdNrNameGet
      summary: Get the value of an object version property
      tags:
        - objectVersionProperties
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/VersionNumberOrLatest'
        - $ref: '#/components/parameters/PropertyName'
      responses:
        '200':
          description: The value of the property; any JSON value
          content:
            application/json:
              schema: { }
        '400':
          description: Invalid version number
        '404':
          description: Object, version or property not found
    put:
      operationId: objectVersionPropertiesIdNrNamePut
      summary: Set the value of an object version property
      description: >-
        Adds the property or replaces its value. The resulting properties of the version are validated against the property registry of the storage root and
        the resulting object_version_properties.json is validated against its schema before anything is written. If validation fails, the stored properties
        are left unchanged.
      tags:
        - objectVersionProperties
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/PropertyName'
      requestBody:
        required: true
        description: The new value of the property; any JSON value. A string value must be sent as a JSON string, i.e. in double quotes.
        content:
          application/json:
            schema: { }
      responses:
        '204':
          description: The property has been set
        '400':
          description: Invalid version number, or the new value is invalid according to the property registry or schema. The response body contains the
            reason.
        '404':
          description: Object or version not found
        '409':
          description: The object is blocked or the item store cannot be written to
    delete:
      operationId: objectVersionPropertiesIdNrNameDelete
      summary: Delete an object version property
      description: >-
        Removes the property from the version. The resulting properties of the version are validated against the property registry of the storage root
        before anything is written, so a required property cannot be deleted.
      tags:
        - objectVersionProperties
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/PropertyName'
      responses:
        '204':
          description: The property has been deleted
        '400':
          description: Invalid version number, or the property is required according to the property registry. The response body contains the reason.
        '404':
          description: Object, version or property not found
        '409':
          description: The object is blocked or the item store cannot be written to

  /consistency-checks:
    post:
      operationId: consistencyChecksPost
      summary: Requests a consistency check of the data vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsistencyCheckRequest'
      responses:
        '202':
          description: The consistency check has been requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyCheckResult'

  /consistency-checks/{id}:
    get:
      operationId: consistencyChecksIdGet
      summary: Returns the status of the consistency check with the specified id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The status of the consistency check with the specified id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyCheckResult'
        '404':
          description: No consistency check with the specified id was found

components:
  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      description: The OCFL object ID
      schema:
        type: string
    VersionNumber:
      name: nr
      in: path
      required: true
      description: The version number, with or without 'v' prefix (e.g. '1' or 'v1')
      schema:
        type: string
    VersionNumberOrLatest:
      name: nr
      in: path
      required: true
      description: The version number, with or without 'v' prefix (e.g. '1' or 'v1'), or 'latest'
      schema:
        type: string
    PropertyName:
      name: name
      in: path
      required: true
      description: The name of the property, as defined in the property registry of the storage root
      schema:
        type: string

  schemas:
    ConsistencyCheckRequest:
      type: object
      # layerId cannot be required because that would make LAYER_IDS type requests impossible
      required: [ type ]
      properties:
        type:
          type: string
          enum: [ LAYER_IDS, LISTING_RECORDS ]
          description: The type of consistency check to perform
        layerId:
          type: integer
          format: int64
          description: The ID of the layer to perform the consistency check on (only applicable for LISTING_RECORDS)

    ConsistencyCheckResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the consistency check
        type:
          type: string
          enum: [ LAYER_IDS, LISTING_RECORDS ]
          description: The type of consistency check that was performed
        layerId:
          type: integer
          format: int64
          description: The ID of the layer that was checked (only applicable for LISTING_RECORDS)
        created:
          type: string
          format: date-time
          description: The date and time when the consistency check was performed
        started:
          type: string
          format: date-time
          description: The date and time when the consistency check was started
        finished:
          type: string
          format: date-time
          description: The date and time when the consistency check was finished
        result:
          type: string
          enum: [ OK, NOT_OK, ERROR ]
          description: The result of the consistency check
        message:
          type: string
          description: A message describing the result of the consistency check

    AppInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string

    RestageFailedRequest:
      type: object
      required: [ selector ]
      properties:
        selector:
          type: string
          description: Import job UUID or inbox batch path

    ImportCommand:
      type: object
      required: [ path ]
      properties:
        path:
          type: string
          format: path
          description: The path to the object import or batch directory
        singleObject:
          type: boolean
          default: false
          description: Whether the import is for a single object or a batch
    ImportJobStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the job
        path:
          type: string
          format: path
          description: The path to the object import or batch directory
        singleObject:
          type: boolean
          description: Whether the import is for a single object or a batch
        status:
          type: string
          description: The current status of the job
          enum:
            - PENDING
            - RUNNING
            - SUCCESS
            - FAILED
        created:
          type: string
          format: date-time
          description: The date and time when the job was created
        started:
          type: string
          format: date-time
          description: The date and time when the job was started
        finished:
          type: string
          format: date-time
          description: The date and time when the job was finished
        message:
          type: string
          description: A message describing the current status of the job
    LayerStatus:
      type: object
      required: [ layerId, status, sizeInBytes ]
      properties:
        layerId:
          type: integer
          format: int64
          description: The timestamp of the layer, in milliseconds since the epoch
        status:
          type: string
          enum: [ OPEN, CLOSED, ARCHIVED ]
          description: The current status of the layer
        sizeInBytes:
          type: integer
          format: int64
          nullable: true
          description: The size of the layer in bytes
        message:
          type: string
          description: An optional message describing the layer status

    CreateDirectoryRequest:
      type: object
      required: [ path ]
      properties:
        path:
          type: string
          format: path
          description: The path to the directory to create

    DeleteDirectoryRequest:
      type: object
      required: [ path ]
      properties:
        path:
          type: string
          format: path
          description: The path to the directory to delete

    DeleteFilesRequest:
      type: object
      required: [ paths ]
      properties:
        paths:
          type: array
          items:
            type: string
            format: path
          description: The paths to the files to delete

    CopyDirectoryIntoRequest:
      type: object
